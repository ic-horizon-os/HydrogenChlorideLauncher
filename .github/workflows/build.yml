name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Rust core
        run: cargo build --release --manifest-path rust/hcl-core/Cargo.toml
      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release
          cp rust/hcl-core/target/release/hcl-core build/linux/x64/release/bundle/
          cp LICENSE build/linux/x64/release/bundle/
          mkdir -p build/linux/x64/release/bundle/licenses
          cp assets/fonts/MapleMono-LICENSE.txt build/linux/x64/release/bundle/licenses/
          tar -C build/linux/x64/release -czf hcl-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-linux-x64
          path: hcl-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        shell: pwsh
        run: ./tool/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-windows-x64
          path: dist/hydrogen-chloride-launcher-0.1.0-alpha.1-windows-x64.zip
