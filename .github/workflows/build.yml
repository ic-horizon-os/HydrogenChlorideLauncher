name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release
          cp LICENSE build/linux/x64/release/bundle/
          mkdir -p build/linux/x64/release/bundle/licenses
          cp assets/fonts/MapleMono-LICENSE.txt build/linux/x64/release/bundle/licenses/
          tar -C build/linux/x64/release -czf hcl-linux-x64.tar.gz bundle
      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" hcl-linux-x64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              hcl-linux-x64.tar.gz \
              --title "Hydrogen Chloride Launcher $GITHUB_REF_NAME" \
              --notes "Linux x64 构建（Flutter/Dart，纯 Dart 后端）。解压后运行 bundle/hydrogen_chloride_launcher。"
          fi
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: hcl-linux-x64
          path: hcl-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        shell: pwsh
        run: ./tool/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-windows-x64
          path: dist/hydrogen-chloride-launcher-0.1.0-alpha.1-windows-x64.zip
